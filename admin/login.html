<body>

<nav>
  <div class="container">
    <a href="../index.html" class="logo">
      PriyansuCodes<span>.</span>
      <small>Full&nbsp;Stack&nbsp;Developer — Rev. 2026</small>

    <ul class="nav-links" id="navLinks">

  </div>

<main class="admin-shell">
  <div class="admin-card">
    <div class="corner tl"></div><div class="corner br"></div>
    <div class="eyebrow">Restricted — Sheet 00</div>
    <h1>Admin Access</h1>
    <p class="sub">Sign in to manage projects and inquiries.</p>

    <div id="formMsg"></div>

    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required autofocus autocomplete="username" maxlength="50" spellcheck="false">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" required autocomplete="current-password">
          <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>
      <button type="submit">Sign in</button>
    </form>

  </div>
</main>

<footer>
  <div class="container footer-row">
    <p>&copy; <span data-year>2026</span> Priyansu Shrestha. Built from scratch — Node.js, MySQL &amp; a drafting table.</p>
